name: rules

# Checks the PR when it is opened or reopened and whenever its title or description is edited,
# so a text edit does not rerun the whole CI. Later pushes to the PR are checked by ci.yml
# (job changes), and so is make check-rules.
on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/playbook
          path: .playbook
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .playbook/scripts/check-pr.sh "$BASE" "$HEAD"
