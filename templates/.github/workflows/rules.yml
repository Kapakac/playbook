name: rules

# Checks the PR when its title or description is edited, so a text edit does not rerun the whole
# CI. Everything else (opening, reopening, marking a draft ready, every push) is checked by the
# same script in ci.yml, job changes: a job of its own here would cost one more minute each time.
# Drafts are skipped: an agent cleans up the text its environment added while the PR is a draft.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  check-pr:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/playbook
          path: .playbook
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .playbook/scripts/check-pr.sh "$BASE" "$HEAD"
