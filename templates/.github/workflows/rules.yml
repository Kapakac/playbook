name: rules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/playbook
          path: .playbook
          fetch-depth: 0
      - run: make check-rules PLAYBOOK=.playbook
