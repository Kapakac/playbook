name: CI

# Only on PRs: main changes only through PRs, and the PR run has already checked the merge with
# main, so a run after the merge would repeat it. A deploy starts from the push itself (README
# playbook, «Минуты Actions»). Drafts are skipped: the agent pushes once, cleans up the PR text and
# marks it ready, and CI runs then.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Heavy jobs depend on this one and are skipped when only documentation changed.
  # A skipped job counts as passed for required status checks, so such PRs do not hang.
  # The quick checks that must run on every change are steps here, not jobs of their own:
  # GitHub bills every job as at least one minute.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/playbook
          path: .playbook
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .playbook/scripts/ci-changes.sh "$BASE" >>"$GITHUB_OUTPUT"
      - name: Install gitleaks
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Secret scan (gitleaks)
        run: gitleaks git --redact --no-banner --exit-code 1 .
      - name: Shared rules are not edited by hand
        run: make check-rules PLAYBOOK=.playbook
      # An edit of the title or description alone is checked by rules.yml, without the whole CI.
      - name: PR branch, title, commits and text follow the playbook
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .playbook/scripts/check-pr.sh "$BASE" "$HEAD"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make lint
      - run: make test
