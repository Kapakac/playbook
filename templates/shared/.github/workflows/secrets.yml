name: secrets

on:
  push:
    branches: [shared]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      # Only the pushed commits: once a leaked secret is removed, later pushes go green again.
      # A new branch or a force push has no usable base, so the whole branch is scanned.
      - name: Scan the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range=()
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            range=(--log-opts="$BEFORE..HEAD")
          fi
          gitleaks git --redact --verbose --no-banner --exit-code 1 "${range[@]}" .
